<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiemme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Plan: un solo mundo oscuro (sin tema claro). Brasas subiendo sobre negro violáceo,
     una tarjeta de vidrio alineada a la izquierda, nombre en letra gótica con brillo. */
  :root {
    color-scheme: dark;
    --bg: #08060a;
    --ink: #f3eaef;
    --muted: #a39099;
    --accent: #ff3d6e;
    --ember: #ffb199;
    --glass: rgba(255, 255, 255, 0.045);
    --line: rgba(255, 255, 255, 0.11);
    --display: "Pirata One", "UnifrakturCook", Georgia, serif;
    --body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(90% 60% at 50% 110%, rgba(255, 61, 110, 0.22), transparent 70%),
      radial-gradient(50% 40% at 15% 0%, rgba(255, 177, 153, 0.07), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .stage {
    position: relative;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 28px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 22px;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px -30px rgba(255, 61, 110, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.18s ease-out;
    will-change: transform;
  }

  .head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .avatar {
    width: 88px; height: 88px; flex: none;
    border-radius: 50%;
    display: block; object-fit: cover;
    background: var(--bg);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--line), 0 0 34px rgba(255, 61, 110, 0.55);
  }
  .who { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(40px, 11vw, 56px);
    line-height: 0.95;
    letter-spacing: 0.01em;
    overflow-wrap: anywhere;
    text-shadow: 0 0 18px rgba(255, 61, 110, 0.75), 0 0 46px rgba(255, 61, 110, 0.35);
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tags li {
    padding: 2px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ember);
  }

  .bio { margin: 0; min-height: 3em; color: var(--ink); }
  .bio .caret {
    display: inline-block; width: 8px; height: 1.05em;
    margin-left: 2px; vertical-align: -0.15em;
    background: var(--accent);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .meta {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .meta b { color: var(--ink); font-weight: 500; }
  .dot {
    display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .links .lk {
    width: 100%; font: inherit; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
    padding: 10px 12px;
    color: var(--ink); text-decoration: none;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .links .lk.plain { cursor: default; }
  .links .lk:not(.plain):hover { border-color: var(--accent); background: rgba(255, 61, 110, 0.1); transform: translateY(-2px); }
  .mono {
    flex: none; width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 8px;
    font-size: 11px; font-weight: 600;
    color: var(--bg); background: var(--ember);
  }
  .links span { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .links strong { font-weight: 600; font-size: 13px; }
  .links small { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .player {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .play {
    flex: none; width: 38px; height: 38px;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 50%;
    background: transparent; color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .play:hover { border-color: var(--accent); background: rgba(255, 61, 110, 0.12); }
  .play svg { width: 14px; height: 14px; fill: currentColor; }
  .play .i-pause { display: none; }
  .play[aria-pressed="true"] .i-pause { display: block; }
  .play[aria-pressed="true"] .i-play { display: none; }
  .track { flex: 1; min-width: 120px; display: flex; flex-direction: column; line-height: 1.3; }
  .track strong { font-weight: 500; font-size: 13px; }
  .track small { color: var(--muted); font-size: 11px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
  .bars i { width: 3px; height: 4px; background: var(--accent); border-radius: 2px; }
  .playing .bars i { animation: bar 0.9s ease-in-out infinite; }
  .playing .bars i:nth-child(2) { animation-delay: -0.3s; }
  .playing .bars i:nth-child(3) { animation-delay: -0.6s; }
  .playing .bars i:nth-child(4) { animation-delay: -0.15s; }
  @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 18px; } }
  #vol { width: 84px; accent-color: var(--accent); }

  .gate {
    position: fixed; inset: 0; z-index: 5;
    display: grid; place-items: center;
    border: 0; padding: 16px;
    background: rgba(8, 6, 10, 0.55);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    color: var(--ink);
    font-family: var(--body); font-size: 14px;
    letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.5s;
  }
  .gate span { animation: pulse 2.2s ease-in-out infinite; text-shadow: 0 0 16px var(--accent); }
  .gate.off { opacity: 0; pointer-events: none; }
  @keyframes pulse { 50% { opacity: 0.45; } }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--ember); outline-offset: 3px;
  }
  @media (max-width: 420px) {
    .card { padding: 22px; }
    .links { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gate span, .bio .caret, .playing .bars i { animation: none; }
    .card, .links .lk { transition: none; }
  }
</style>
</head>

      <div class="who">
        <h1 id="usuario">Tiemme</h1>
        <ul class="tags" id="tags"></ul>
      </div>
    </header>

    <p class="bio"><span id="bio">Aquí va tu frase. Cuéntale al mundo quién eres.</span><span class="caret" aria-hidden="true"></span></p>

    <div class="meta">
      <span><span class="dot"></span>Local hour <b id="hora">--:--</b></span>
    </div>

    <nav class="links" id="links" aria-label="Redes"></nav>

    <div class="player" id="player">
      <button class="play" id="play" type="button" aria-pressed="false" aria-label="Reproducir o pausar el sonido">
        <svg class="i-play" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/></svg>
      </button>
      <div class="track">
        <strong>brasa lenta</strong>
        <small>ambiente generado en tu navegador</small>
      </div>
      <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <label for="vol" style="position:absolute;left:-9999px">Volumen</label>
      <input id="vol" type="range" min="0" max="100" value="60">
    </div>
  </article>
</main>

<script>
/* ====== EDITA AQUÍ TU PERFIL ====== */
const PERFIL = {
  usuario: "Tiemme",
  frases: [
    "Aquí va tu frase. Cuéntale al mundo quién eres.",
    "Hago cosas en internet de madrugada.",
    "Escríbeme, casi siempre contesto."
  ],
  insignias: ["dev"],
  zonaHoraria: "America/Mexico_City",
  // url: abre el enlace. copiar: true copia el usuario al hacer clic. Sin ninguno, solo muestra el texto.
  enlaces: [
    { red: "Discord",   usuario: "10lr",        sigla: "DC", copiar: true },
    { red: "Instagram", usuario: "unavailable", sigla: "IG" }
  ]
};
/* ================================== */

const $ = (id) => document.getElementById(id);
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Contenido
$("usuario").textContent = PERFIL.usuario;
for (const t of PERFIL.insignias) {
  const li = document.createElement("li");
  li.textContent = t;
  $("tags").appendChild(li);
}
for (const e of PERFIL.enlaces) {
  const a = document.createElement(e.url ? "a" : (e.copiar ? "button" : "div"));
  a.className = "lk";
  if (e.url) { a.href = e.url; a.target = "_blank"; a.rel = "noopener"; }
  const m = document.createElement("b"); m.className = "mono"; m.textContent = e.sigla;
  const s = document.createElement("span");
  const n = document.createElement("strong"); n.textContent = e.red;
  const u = document.createElement("small"); u.textContent = e.usuario;
  s.append(n, u); a.append(m, s);
  if (!e.url && e.copiar) {
    a.type = "button";
    a.title = "Click to copy";
    a.addEventListener("click", () => {
      const done = () => { u.textContent = "copied!"; setTimeout(() => { u.textContent = e.usuario; }, 1400); };
      try { navigator.clipboard.writeText(e.usuario).then(done).catch(() => {}); } catch (err) {}
    });
  } else if (!e.url) {
    a.classList.add("plain");
  }
  $("links").appendChild(a);
}

// Reloj
function tick() {
  try {
    $("hora").textContent = new Intl.DateTimeFormat("es-MX", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: PERFIL.zonaHoraria
    }).format(new Date());
  } catch (err) { $("hora").textContent = "--:--"; }
}
tick(); setInterval(tick, 15000);

// Frase que se escribe sola
if (!calm && PERFIL.frases.length > 1) {
  const el = $("bio");
  let i = 0, n = PERFIL.frases[0].length, dir = -1, wait = 60;
  setInterval(() => {
    if (wait > 0) { wait--; return; }
    const txt = PERFIL.frases[i];
    n += dir;
    el.textContent = txt.slice(0, n);
    if (dir === 1 && n >= txt.length) { dir = -1; wait = 60; }
    else if (dir === -1 && n <= 0) { dir = 1; i = (i + 1) % PERFIL.frases.length; wait = 8; }
  }, 45);
}

// Brasas de fondo
const cv = $("fx"), cx = cv.getContext("2d");
let W = 0, H = 0, parts = [];
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * d; cv.height = H * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
function spawn(anywhere) {
  return {
    x: Math.random() * W,
    y: anywhere ? Math.random() * H : H + 10,
    r: Math.random() * 1.8 + 0.4,
    v: Math.random() * 0.35 + 0.12,
    s: Math.random() * 6.28,
    a: Math.random() * 0.6 + 0.25
  };
}
function draw() {
  cx.clearRect(0, 0, W, H);
  for (const p of parts) {
    if (!calm) {
      p.y -= p.v; p.s += 0.01; p.x += Math.sin(p.s) * 0.25;
      if (p.y < -10) Object.assign(p, spawn(false));
    }
    cx.globalAlpha = Math.max(0, p.a * (p.y / H));
    cx.fillStyle = p.r > 1.4 ? "#ffb199" : "#ff3d6e";
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill();
  }
  if (!calm) requestAnimationFrame(draw);
}
resize();
parts = Array.from({ length: 80 }, () => spawn(true));
draw();
addEventListener("resize", () => { resize(); if (calm) draw(); });

// Inclinación 3D de la tarjeta
const card = $("card");
if (!calm && matchMedia("(hover: hover)").matches) {
  addEventListener("pointermove", (e) => {
    const dx = (e.clientX / W - 0.5) * 2, dy = (e.clientY / H - 0.5) * 2;
    card.style.transform = "perspective(900px) rotateY(" + (dx * 5).toFixed(2) + "deg) rotateX(" + (-dy * 5).toFixed(2) + "deg)";
  });
  document.addEventListener("pointerleave", () => { card.style.transform = ""; });
}

// Sonido ambiente (sintetizado, sin archivos)
let ac = null, master = null, playing = false;
function buildAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = 0;
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 520; lp.Q.value = 0.7;
  const lfo = ac.createOscillator(), lfoGain = ac.createGain();
  lfo.frequency.value = 0.07; lfoGain.gain.value = 260;
  lfo.connect(lfoGain); lfoGain.connect(lp.frequency); lfo.start();
  for (const f of [110, 164.81, 220, 261.63, 329.63]) {
    for (const det of [-6, 7]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
      g.gain.value = 0.05;
      o.connect(g); g.connect(lp); o.start();
    }
  }
  lp.connect(master); master.connect(ac.destination);
}
function level() { return ($("vol").value / 100) * 0.5; }
function setPlaying(on) {
  try {
    if (on && !ac) buildAudio();
    if (!ac) return;
    if (on) ac.resume();
    master.gain.setTargetAtTime(on ? level() : 0, ac.currentTime, 0.4);
    playing = on;
  } catch (err) { playing = false; }
  $("play").setAttribute("aria-pressed", String(playing));
  $("player").classList.toggle("playing", playing);
}
$("play").addEventListener("click", () => setPlaying(!playing));
$("vol").addEventListener("input", () => {
  if (ac && playing) master.gain.setTargetAtTime(level(), ac.currentTime, 0.05);
});

// Entrada
$("gate").addEventListener("click", () => {
  $("gate").classList.add("off");
  setPlaying(true);
  $("play").focus({ preventScroll: true });
});
</script>
</body>
